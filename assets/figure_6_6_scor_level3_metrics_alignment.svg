    <text x="615" y="60" fill="#cbd5e1" font-size="10">&#8226; Pre-Commissioned Telematics</text>
    <text x="615" y="76" fill="#38bdf8" font-size="10">Automated Vehicle Handover</text>

    <!-- Arrow 3 to 4 -->
