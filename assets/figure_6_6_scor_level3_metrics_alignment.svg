  </defs>
  <!-- Full Canvas Background -->
  <rect width="1200" height="860" fill="#0b1120" rx="12"/>


  <!-- Header Banner -->
  <rect x="30" y="20" width="1140" height="65" rx="10" fill="url(#headerGrad6)" filter="url(#shadow6)"/>
  <text x="600" y="50" fill="#ffffff" font-size="20" font-weight="bold" text-anchor="middle" letter-spacing="0.5">FIGURE 6.6: SCOR LEVEL 3 PROCESS FLOW &amp; MULTI-ENTERPRISE PERFORMANCE BINDING</text>
  <text x="600" y="72" fill="#d1fae5" font-size="13" text-anchor="middle">Phase D OT/IT Technology Stack &#8226; Real-Time Supply Chain KPIs &#8226; Closed-Loop Fiduciary Metrics</text>

  <!-- ================= TOP: SCOR LEVEL 1 & 2 PROCESS THREADS ================= -->
  <rect x="30" y="105" width="1140" height="150" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" filter="url(#shadow6)"/>
  <rect x="45" y="115" width="360" height="24" rx="4" fill="#0369a1"/>
  <text x="55" y="132" fill="#ffffff" font-size="12" font-weight="bold">SCOR LEVEL 1 &amp; 2 MULTI-ENTERPRISE THREADS</text>

  <g transform="translate(50, 150)">
