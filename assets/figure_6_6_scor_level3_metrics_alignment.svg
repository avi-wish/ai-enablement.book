    <text x="580" y="70" fill="#e2e8f0" font-size="11">&#8226; Legacy State: Line shutdowns every 20 min extended pack build time to <tspan fill="#ef4444">18 hrs/pack</tspan>.</text>
    <text x="580" y="88" fill="#e2e8f0" font-size="11">&#8226; Phase D Fix: Sub-2ms on-premise vision inference removes cloud round-trip.</text>
    <text x="580" y="106" fill="#4ade80" font-size="11" font-weight="bold">&#8226; Production Output: Continuous 45-sec cycle time &#8594; Pack build reduced to 3.2 hrs.</text>
    <text x="580" y="126" fill="#4ade80" font-size="10">Governing Stakeholder: Rajesh Iyer (Volt-Tech Chief Engineer)</text>

    <!-- Metric 3: Asset Management (AM.1.1) -->
    <rect x="0" y="165" width="535" height="145" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1.2"/>
    <rect x="0" y="165" width="535" height="30" rx="8" fill="#b45309"/>
    <text x="15" y="185" fill="#ffffff" font-size="12" font-weight="bold">ASSET UTILIZATION: OVERALL FLEET &amp; PLANT UPTIME (AM.1.1 &#8805; 98%)</text>
    <text x="15" y="217" fill="#94a3b8" font-size="11">Technical Root Cause:</text>
    <text x="15" y="235" fill="#e2e8f0" font-size="11">&#8226; Legacy State: Fleet stranded rate was 8.4%; Factory OEE was only 68.2%.</text>
    <text x="15" y="253" fill="#e2e8f0" font-size="11">&#8226; Phase D Fix: Real-time closed-loop EIS Digital Twin &amp; Automated Micro-Clamping.</text>
    <text x="15" y="271" fill="#4ade80" font-size="11" font-weight="bold">&#8226; Production Output: Plant OEE jumps to 94.6%; Fleet Uptime reaches 98.9%.</text>
    <text x="15" y="291" fill="#fcd34d" font-size="10">Governing Stakeholder: Kavita Joshi (Orbit Fiscal Architect)</text>

    <!-- Metric 4: Total Supply Chain Cost (CO.1.1) -->
    <rect x="565" y="165" width="535" height="145" rx="8" fill="#1e293b" stroke="#ec4899" stroke-width="1.2"/>
    <rect x="565" y="165" width="535" height="30" rx="8" fill="#be185d"/>
    <text x="580" y="185" fill="#ffffff" font-size="12" font-weight="bold">COST: TOTAL COST TO SERVE &amp; WARRANTY BLEED (CO.1.1)</text>
    <text x="580" y="217" fill="#94a3b8" font-size="11">Technical Root Cause:</text>
    <text x="580" y="235" fill="#e2e8f0" font-size="11">&#8226; Legacy State: <tspan fill="#ef4444">$50M quarterly fleet bleed</tspan> + $32M annual manufacturing scrap.</text>
    <text x="580" y="253" fill="#e2e8f0" font-size="11">&#8226; Phase D Fix: 99.98% First-Pass Weld Yield + Cryptographic HSM Warranty Ledger.</text>
    <text x="580" y="271" fill="#4ade80" font-size="11" font-weight="bold">&#8226; Production Output: Factory scrap cut 98%; Warranty claims eliminated.</text>
    <text x="580" y="291" fill="#f472b6" font-size="10">Governing Stakeholder: Priya Kapoor (Volt-Tech Fiscal Architect)</text>
