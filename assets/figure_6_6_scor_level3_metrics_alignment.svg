    <text x="15" y="70" fill="#e2e8f0" font-size="11">&#8226; Legacy State: <tspan fill="#ef4444">91.2% fulfillment</tspan> caused by mid-route battery cell voltage collapses.</text>
    <text x="15" y="88" fill="#e2e8f0" font-size="11">&#8226; Phase D Fix: Edge TinyML BMS + Adaptive Smart Depot Charging.</text>
    <text x="15" y="106" fill="#4ade80" font-size="11" font-weight="bold">&#8226; Production Output: Zero PSoC cell degradation &#8594; 99.85% Perfect Delivery.</text>
    <text x="15" y="126" fill="#38bdf8" font-size="10">Governing Stakeholder: Anjali Mehra (Orbit-Logistics Operational Lead)</text>

