  <!-- ================= BOTTOM: STRATEGIC ENTERPRISE ACCORD ================= -->
  <rect x="30" y="675" width="1140" height="150" rx="10" fill="#032b1e" stroke="#10b981" stroke-width="1.8" filter="url(#shadow6)"/>
  <rect x="45" y="685" width="400" height="24" rx="4" fill="#047857"/>
  <text x="55" y="702" fill="#ffffff" font-size="12" font-weight="bold">EXECUTIVE FIDUCIARY &amp; ARCHITECTURE BOARD VERDICT</text>

  <g transform="translate(50, 725)">
    <text x="0" y="20" fill="#d1fae5" font-size="12" font-weight="bold">&#8226; Fiduciary Verdict:</text>
    <text x="130" y="20" fill="#ffffff" font-size="12">The $38M Phase D Technology Architecture investment yields a verified net payback within 4.2 months across both enterprises.</text>
    
    <text x="0" y="45" fill="#d1fae5" font-size="12" font-weight="bold">&#8226; Technical Verdict:</text>
    <text x="130" y="45" fill="#ffffff" font-size="12">Decoupling physical shop-floor robotics from cloud latency transforms AI from a brittle experimental pilot into an automotive-grade industrial reality.</text>

    <text x="0" y="70" fill="#d1fae5" font-size="12" font-weight="bold">&#8226; Transition to Ch 7:</text>
    <text x="130" y="70" fill="#a7f3d0" font-size="12">With manufacturing and fleet telemetry fully synchronized, the ecosystem turns to Terra-Resource in Chapter 7 to optimize physical extraction workflows via AI-driven Business Process Re-engineering (Phase B).</text>
