    <text x="905" y="24" fill="#fb923c" font-size="12" font-weight="bold">sE: Enable Fleet Operations</text>
    <text x="905" y="44" fill="#fed7aa" font-size="10">Orbit Smart Depot Grid Hub</text>
    <text x="905" y="60" fill="#fed7aa" font-size="10">&#8226; Fast-Charging SLA</text>
    <text x="905" y="76" fill="#fb923c" font-size="10">Adaptive BMS Synchronization</text>
