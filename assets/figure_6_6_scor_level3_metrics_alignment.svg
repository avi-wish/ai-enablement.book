    <text x="15" y="44" fill="#94a3b8" font-size="10">Terra-Resource Extraction Mines</text>
    <text x="15" y="60" fill="#cbd5e1" font-size="10">&#8226; Lithium / Nickel / Cobalt</text>
    <text x="15" y="76" fill="#4ade80" font-size="10">Digital Product Passport Verified</text>

    <!-- Arrow 1 to 2 -->
    <path d="M 260 42 L 285 42" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrowScor)"/>

    <!-- Node 2: Volt-Tech Make -->
    <rect x="295" y="0" width="260" height="85" rx="6" fill="#052e16" stroke="#22c55e" stroke-width="1.5"/>
    <text x="310" y="24" fill="#4ade80" font-size="12" font-weight="bold">sM2: Make-to-Order Battery</text>
    <text x="310" y="44" fill="#dcfce7" font-size="10">Volt-Tech Advanced Robotics Plant</text>
    <text x="310" y="60" fill="#dcfce7" font-size="10">&#8226; OP-10 &#8594; OP-60 Assembly</text>
    <text x="310" y="76" fill="#4ade80" font-size="10">1.8ms Edge Vision &#8226; Zero Line Halts</text>

