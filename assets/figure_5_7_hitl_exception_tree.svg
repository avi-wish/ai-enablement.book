  <g transform="translate(390, 118)" filter="url(#shadow-card)">
    <rect width="460" height="82" rx="10" fill="url(#rootGrad)" stroke="#334155" stroke-width="1.5" />
    <rect x="16" y="10" width="145" height="18" rx="4" fill="#3b82f6" fill-opacity="0.25" stroke="#60a5fa" stroke-width="0.75" />
    <text x="88" y="22.5" fill="#93c5fd" font-size="9.5" font-weight="700" text-anchor="middle" letter-spacing="0.04em">RAW INGESTION LAYER</text>
    <text x="230" y="47" fill="#ffffff" font-size="15" font-weight="700" text-anchor="middle">Ingested Legacy Record</text>
    <text x="230" y="67" fill="#94a3b8" font-size="11.5" font-weight="500" text-anchor="middle">Historical borehole logs, CSVs &amp; scanned PDF assays (1994–2018)</text>
  </g>

  <!-- Connector Line 1 -> 2 -->
  <path d="M 620 200 L 620 230" fill="none" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow-slate)" />

