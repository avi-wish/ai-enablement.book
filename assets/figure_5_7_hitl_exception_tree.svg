    <rect x="16" y="10" width="175" height="18" rx="4" fill="#0284c7" fill-opacity="0.25" stroke="#38bdf8" stroke-width="0.75" />
    <text x="103" y="22.5" fill="#7dd3fc" font-size="9.5" font-weight="700" text-anchor="middle" letter-spacing="0.04em">ANTI-CORRUPTION LAYER (ACL)</text>
