<svg height="720" width="1100" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 720" style="background:#ffffff; width: 100%; height: auto; font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;"Segoe UI', Roboto, Helvetica, Arial, sans-serif; background-color: #ffffff;">
  <defs>
