<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 300" width="100%" height="auto">
  <rect width="980" height="300" fill="#0f172a" rx="12" />
  
  <text x="490" y="40" fill="#f8fafc" font-family="sans-serif" font-size="20" font-weight="bold" text-anchor="middle">Figure 10.5: Phase H Value-Sharing Incentive Architecture</text>
  <text x="490" y="60" fill="#94a3b8" font-family="sans-serif" font-size="13" text-anchor="middle">Automated mapping of human intervention to ERP financial distributions</text>

  <!-- Step 1 -->
  <rect x="40" y="90" width="180" height="150" fill="#1e293b" rx="8" stroke="#38bdf8" stroke-width="2" />
  <rect x="40" y="90" width="180" height="35" fill="#38bdf8" rx="8" />
  <rect x="40" y="115" width="180" height="10" fill="#38bdf8" />
  <text x="130" y="113" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">1. Human Input</text>
  
  <rect x="50" y="140" width="160" height="85" fill="#334155" rx="6" />
  <text x="130" y="165" fill="#e2e8f0" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">HITL Tele-Assist</text>
  <text x="130" y="185" fill="#cbd5e1" font-family="sans-serif" font-size="11" text-anchor="middle">Operator takes over</text>
  <text x="130" y="200" fill="#cbd5e1" font-family="sans-serif" font-size="11" text-anchor="middle">during snowstorm</text>
  <text x="130" y="215" fill="#cbd5e1" font-family="sans-serif" font-size="11" text-anchor="middle">(APM Latency &lt; 200ms)</text>

  <!-- Arrow 1 to 2 -->
  <line x1="220" y1="165" x2="260" y2="165" stroke="#94a3b8" stroke-width="3" stroke-dasharray="6,4" />
  <polygon points="270,165 255,155 255,175" fill="#94a3b8" />

  <!-- Step 2 -->
  <rect x="280" y="90" width="180" height="150" fill="#1e293b" rx="8" stroke="#3b82f6" stroke-width="2" />
  <rect x="280" y="90" width="180" height="35" fill="#3b82f6" rx="8" />
  <rect x="280" y="115" width="180" height="10" fill="#3b82f6" />
  <text x="370" y="113" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">2. Resolution</text>
  
  <rect x="290" y="140" width="160" height="85" fill="#334155" rx="6" />
  <text x="370" y="165" fill="#60a5fa" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Edge Case Solved</text>
  <text x="370" y="185" fill="#cbd5e1" font-family="sans-serif" font-size="11" text-anchor="middle">Avoids total stop</text>
  <text x="370" y="200" fill="#cbd5e1" font-family="sans-serif" font-size="11" text-anchor="middle">Reduces idle time</text>
  <text x="370" y="215" fill="#cbd5e1" font-family="sans-serif" font-size="11" text-anchor="middle">Prevents SLA breach</text>

  <!-- Arrow 2 to 3 -->
  <line x1="460" y1="165" x2="500" y2="165" stroke="#94a3b8" stroke-width="3" stroke-dasharray="6,4" />
  <polygon points="510,165 495,155 495,175" fill="#94a3b8" />

  <!-- Step 3 -->
  <rect x="520" y="90" width="180" height="150" fill="#1e293b" rx="8" stroke="#8b5cf6" stroke-width="2" />
  <rect x="520" y="90" width="180" height="35" fill="#8b5cf6" rx="8" />
  <rect x="520" y="115" width="180" height="10" fill="#8b5cf6" />
  <text x="610" y="113" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">3. SCOR Metric</text>
  
  <rect x="530" y="140" width="160" height="85" fill="#334155" rx="6" />
  <text x="610" y="165" fill="#c4b5fd" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Efficiency Gained</text>
  <text x="610" y="185" fill="#cbd5e1" font-family="sans-serif" font-size="11" text-anchor="middle">Target AM.1.1 Maintained</text>
  <text x="610" y="200" fill="#cbd5e1" font-family="sans-serif" font-size="11" text-anchor="middle">Value realized in APM</text>
  <text x="610" y="215" fill="#4ade80" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">+ $550 Cost Saved</text>

  <!-- Arrow 3 to 4 -->
  <line x1="700" y1="165" x2="740" y2="165" stroke="#10b981" stroke-width="3" />
  <polygon points="750,165 735,155 735,175" fill="#10b981" />

  <!-- Step 4 -->
  <rect x="760" y="90" width="180" height="150" fill="#064e3b" rx="8" stroke="#10b981" stroke-width="2" />
  <rect x="760" y="90" width="180" height="35" fill="#10b981" rx="8" />
  <rect x="760" y="115" width="180" height="10" fill="#10b981" />
  <text x="850" y="113" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">4. Automated Payout</text>
  
  <rect x="770" y="140" width="160" height="85" fill="#022c22" rx="6" stroke="#10b981" stroke-width="1.5" />
  <text x="850" y="165" fill="#34d399" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">ERP Smart Contract</text>
  <text x="850" y="185" fill="#a7f3d0" font-family="sans-serif" font-size="11" text-anchor="middle">Triggers Wage Multiplier</text>
  <text x="850" y="200" fill="#a7f3d0" font-family="sans-serif" font-size="11" text-anchor="middle">Safety bonus dispersed</text>
  <text x="850" y="215" fill="#fbbf24" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Operator Shares Profit</text>

</svg>
