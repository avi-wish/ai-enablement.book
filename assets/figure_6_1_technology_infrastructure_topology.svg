    <text x="180" y="55" fill="#ffedd5" font-size="10">&#8226; Solar Microgrid Tie</text>

    <rect x="340" y="0" width="155" height="70" rx="5" fill="#7c2d12" stroke="#fb923c" stroke-width="0.8"/>
