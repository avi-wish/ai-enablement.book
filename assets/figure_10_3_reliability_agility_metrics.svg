<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 400" width="100%" height="auto">
  <rect width="980" height="400" fill="#0f172a" rx="12" />
  
  <text x="490" y="45" fill="#f8fafc" font-family="sans-serif" font-size="20" font-weight="bold" text-anchor="middle">Figure 10.3: SCOR Reliability (RL.1.1) &amp; Agility (AG.1.1) Performance Matrices</text>

  <rect x="50" y="80" width="880" height="280" fill="#1e293b" rx="8" stroke="#10b981" stroke-width="2" />

  <!-- Divider -->
  <line x1="490" y1="100" x2="490" y2="340" stroke="#334155" stroke-width="2" />

  <!-- Left Chart: RL.1.1 -->
  <text x="270" y="120" fill="#f8fafc" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Reliability (RL.1.1): Perfect Shipment Delivery</text>

  <!-- Y axis line -->
  <line x1="120" y1="150" x2="120" y2="300" stroke="#94a3b8" stroke-width="1" />
  <!-- X axis line -->
  <line x1="120" y1="300" x2="420" y2="300" stroke="#94a3b8" stroke-width="1" />

  <!-- Target Bar -->
  <rect x="180" y="170" width="60" height="130" fill="#475569" rx="4" />
  <text x="210" y="160" fill="#cbd5e1" font-size="12" font-family="sans-serif" text-anchor="middle">99.8%</text>
  <text x="210" y="325" fill="#94a3b8" font-size="13" font-family="sans-serif" text-anchor="middle">Phase A Target</text>
  
  <!-- Actual Bar -->
  <rect x="290" y="160" width="60" height="140" fill="#3b82f6" rx="4" />
  <text x="320" y="150" fill="#60a5fa" font-size="13" font-family="sans-serif" font-weight="bold" text-anchor="middle">99.88%</text>
  <text x="320" y="325" fill="#38bdf8" font-size="13" font-family="sans-serif" font-weight="bold" text-anchor="middle">Live APM</text>


  <!-- Right Chart: AG.1.1 -->
  <text x="710" y="120" fill="#f8fafc" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Agility (AG.1.1): Upside Volume Surge Capacity</text>

  <!-- Y axis line -->
  <line x1="560" y1="150" x2="560" y2="300" stroke="#94a3b8" stroke-width="1" />
  <!-- X axis line -->
  <line x1="560" y1="300" x2="860" y2="300" stroke="#94a3b8" stroke-width="1" />

  <!-- Target Bar -->
  <rect x="620" y="210" width="60" height="90" fill="#475569" rx="4" />
  <text x="650" y="200" fill="#cbd5e1" font-size="12" font-family="sans-serif" text-anchor="middle">20%</text>
  <text x="650" y="325" fill="#94a3b8" font-size="13" font-family="sans-serif" text-anchor="middle">Phase A Target</text>
  
  <!-- Actual Bar -->
  <rect x="730" y="180" width="60" height="120" fill="#10b981" rx="4" />
  <text x="760" y="170" fill="#34d399" font-size="13" font-family="sans-serif" font-weight="bold" text-anchor="middle">24%</text>
  <text x="760" y="325" fill="#10b981" font-size="13" font-family="sans-serif" font-weight="bold" text-anchor="middle">Live APM</text>

</svg>
