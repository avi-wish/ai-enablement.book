<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 250" width="100%" height="auto">
  <rect width="980" height="250" fill="#0f172a" rx="12" />
  
  <text x="490" y="40" fill="#f8fafc" font-family="sans-serif" font-size="20" font-weight="bold" text-anchor="middle">Figure 10.6: Fleet Utilization Target Breakdown (SCOR AM.1.1)</text>
  <text x="490" y="60" fill="#94a3b8" font-family="sans-serif" font-size="13" text-anchor="middle">Visualizing the operational gap closed by the augmented Human-In-The-Loop workforce</text>

  <rect x="50" y="90" width="880" height="120" fill="#1e293b" rx="8" stroke="#334155" stroke-width="2" />

  <!-- Metric Labels -->
  <text x="70" y="130" fill="#cbd5e1" font-family="sans-serif" font-size="13" font-weight="bold">Manual Operations Baseline</text>
  <text x="70" y="175" fill="#38bdf8" font-family="sans-serif" font-size="13" font-weight="bold">HITL Augmented Target (Phase H)</text>
  
  <!-- Base Tracks -->
  <rect x="290" y="115" width="600" height="20" fill="#0f172a" rx="10" stroke="#334155" stroke-width="1" />
  <rect x="290" y="160" width="600" height="20" fill="#0f172a" rx="10" stroke="#334155" stroke-width="1" />

  <!-- Baseline Progress -->
  <rect x="290" y="115" width="390" height="20" fill="#475569" rx="10" />
  <text x="690" y="130" fill="#94a3b8" font-family="sans-serif" font-size="13" font-weight="bold">65%</text>

  <!-- Augmented Target Progress -->
  <rect x="290" y="160" width="390" height="20" fill="#3b82f6" rx="10" />
  <rect x="680" y="160" width="138" height="20" fill="#10b981" rx="10" /> <!-- The Gap segment -->
  <text x="830" y="175" fill="#34d399" font-family="sans-serif" font-size="13" font-weight="bold">88% (Target)</text>

  <!-- Gap Callout -->
  <line x1="680" y1="185" x2="680" y2="200" stroke="#10b981" stroke-width="1.5" />
  <line x1="818" y1="185" x2="818" y2="200" stroke="#10b981" stroke-width="1.5" />
  <line x1="680" y1="200" x2="818" y2="200" stroke="#10b981" stroke-width="1.5" />
  <polygon points="749,200 744,195 754,195" fill="#10b981" />
  
  <text x="749" y="215" fill="#a7f3d0" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">The "Value Realization" Gap</text>
  <text x="749" y="230" fill="#6ee7b7" font-family="sans-serif" font-size="11" text-anchor="middle">Closed exclusively by Academy upskilling</text>

</svg>
