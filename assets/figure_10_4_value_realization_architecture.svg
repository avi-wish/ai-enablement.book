<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 500" width="980" height="500" style="background:#ffffff; width: 100%; height: auto; font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <rect width="980" height="500" fill="#0f172a" rx="12" />
  
  <text x="490" y="45" fill="#f8fafc" font-family="sans-serif" font-size="20" font-weight="bold" text-anchor="middle">Figure 10.4: Value Realization Dashboard Architecture Components</text>
  <text x="490" y="70" fill="#94a3b8" font-family="sans-serif" font-size="14" text-anchor="middle">End-to-end telemetry pipeline mapping field operations to Phase H Governance</text>

  <!-- Layer 1: Data Sources -->
  <rect x="40" y="110" width="200" height="340" fill="#1e293b" rx="8" stroke="#64748b" stroke-width="2" />
  <rect x="40" y="110" width="200" height="35" fill="#64748b" rx="8" />
  <rect x="40" y="135" width="200" height="10" fill="#64748b" />
  <text x="140" y="133" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">1. Data Sources</text>

  <rect x="60" y="170" width="160" height="60" fill="#334155" rx="6" />
  <text x="140" y="195" fill="#38bdf8" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Fleet Telemetry</text>
  <text x="140" y="215" fill="#cbd5e1" font-family="sans-serif" font-size="11" text-anchor="middle">Vehicle IoT &amp; Sensors</text>

  <rect x="60" y="250" width="160" height="60" fill="#334155" rx="6" />
  <text x="140" y="275" fill="#38bdf8" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Depot Academy</text>
  <text x="140" y="295" fill="#cbd5e1" font-family="sans-serif" font-size="11" text-anchor="middle">HITL Latency Logs</text>

  <rect x="60" y="330" width="160" height="60" fill="#334155" rx="6" />
  <text x="140" y="355" fill="#38bdf8" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Corporate ERP</text>
  <text x="140" y="375" fill="#cbd5e1" font-family="sans-serif" font-size="11" text-anchor="middle">Financials (OpEx)</text>

  <!-- Arrows 1 to 2 -->
  <line x1="240" y1="200" x2="270" y2="200" stroke="#94a3b8" stroke-width="2" stroke-dasharray="4,4" />
  <line x1="240" y1="280" x2="270" y2="280" stroke="#94a3b8" stroke-width="2" stroke-dasharray="4,4" />
  <line x1="240" y1="360" x2="270" y2="360" stroke="#94a3b8" stroke-width="2" stroke-dasharray="4,4" />

  <!-- Layer 2: Observability Pipeline -->
  <rect x="270" y="110" width="200" height="340" fill="#1e293b" rx="8" stroke="#3b82f6" stroke-width="2" />
  <rect x="270" y="110" width="200" height="35" fill="#3b82f6" rx="8" />
  <rect x="270" y="135" width="200" height="10" fill="#3b82f6" />
  <text x="370" y="133" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">2. Observability Pipeline</text>

  <rect x="290" y="200" width="160" height="150" fill="#0f172a" rx="6" stroke="#475569" stroke-width="1.5" />
  <text x="370" y="240" fill="#f1f5f9" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">OpenTelemetry</text>
  <text x="370" y="260" fill="#f1f5f9" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Collector Nodes</text>
  <line x1="310" y1="280" x2="430" y2="280" stroke="#334155" stroke-width="1" />
  <text x="370" y="300" fill="#cbd5e1" font-family="sans-serif" font-size="11" text-anchor="middle">Metric Aggregation</text>
  <text x="370" y="320" fill="#cbd5e1" font-family="sans-serif" font-size="11" text-anchor="middle">Log Filtering</text>

  <!-- Arrow 2 to 3 -->
  <line x1="470" y1="280" x2="500" y2="280" stroke="#3b82f6" stroke-width="3" />
  <polygon points="510,280 495,270 495,290" fill="#3b82f6" />

  <!-- Layer 3: APM Core -->
  <rect x="510" y="110" width="200" height="340" fill="#1e293b" rx="8" stroke="#8b5cf6" stroke-width="2" />
  <rect x="510" y="110" width="200" height="35" fill="#8b5cf6" rx="8" />
  <rect x="510" y="135" width="200" height="10" fill="#8b5cf6" />
  <text x="610" y="133" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">3. APM Analytics Core</text>

  <rect x="530" y="170" width="160" height="70" fill="#334155" rx="6" />
  <text x="610" y="200" fill="#c4b5fd" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Time-Series DB</text>
  <text x="610" y="220" fill="#e2e8f0" font-family="sans-serif" font-size="11" text-anchor="middle">Prometheus / Splunk</text>

  <rect x="530" y="260" width="160" height="70" fill="#334155" rx="6" />
  <text x="610" y="290" fill="#c4b5fd" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Correlation Engine</text>
  <text x="610" y="310" fill="#e2e8f0" font-family="sans-serif" font-size="11" text-anchor="middle">Mapping OpEx to Fleet</text>

  <rect x="530" y="350" width="160" height="70" fill="#334155" rx="6" />
  <text x="610" y="380" fill="#c4b5fd" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">SCOR Calculator</text>
  <text x="610" y="400" fill="#e2e8f0" font-family="sans-serif" font-size="11" text-anchor="middle">Yields RL.1.1 &amp; AG.1.1</text>

  <!-- Arrow 3 to 4 -->
  <line x1="710" y1="280" x2="740" y2="280" stroke="#8b5cf6" stroke-width="3" />
  <polygon points="750,280 735,270 735,290" fill="#8b5cf6" />

  <!-- Layer 4: Governance Presentation -->
  <rect x="750" y="110" width="200" height="340" fill="#1e293b" rx="8" stroke="#10b981" stroke-width="2" />
  <rect x="750" y="110" width="200" height="35" fill="#10b981" rx="8" />
  <rect x="750" y="135" width="200" height="10" fill="#10b981" />
  <text x="850" y="133" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">4. Phase H Presentation</text>

  <rect x="770" y="200" width="160" height="150" fill="#064e3b" rx="6" stroke="#10b981" stroke-width="1.5" />
  <text x="850" y="240" fill="#34d399" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Executive UI</text>
  <text x="850" y="260" fill="#a7f3d0" font-family="sans-serif" font-size="12" text-anchor="middle">(Grafana Dashboard)</text>
  <line x1="790" y1="280" x2="910" y2="280" stroke="#047857" stroke-width="1" />
  <text x="850" y="300" fill="#e2e8f0" font-family="sans-serif" font-size="11" text-anchor="middle">Live Cost Tracking</text>
  <text x="850" y="320" fill="#e2e8f0" font-family="sans-serif" font-size="11" text-anchor="middle">Automated CHG Alerts</text>

</svg>
