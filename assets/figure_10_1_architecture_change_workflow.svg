<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 400" width="980" height="400" style="background:#ffffff; width: 100%; height: auto; font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <rect width="980" height="400" fill="#0f172a" rx="12" />
  
  <text x="490" y="45" fill="#f8fafc" font-family="sans-serif" font-size="20" font-weight="bold" text-anchor="middle">Figure 10.1: Architecture Change Management Workflow Matrix</text>
  
  <rect x="50" y="80" width="880" height="280" fill="#1e293b" rx="8" stroke="#3b82f6" stroke-width="2" />

  <!-- Node 1: Driver -->
  <rect x="80" y="110" width="200" height="90" fill="#334155" rx="6" stroke="#475569" stroke-width="1.5" />
  <text x="180" y="135" fill="#38bdf8" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Driver</text>
  <text x="180" y="160" fill="#e2e8f0" font-family="sans-serif" font-size="12" text-anchor="middle">APM Telemetry Alerts</text>
  <text x="180" y="180" fill="#94a3b8" font-family="sans-serif" font-size="11" text-anchor="middle">Workforce Friction Detected</text>

  <line x1="280" y1="155" x2="330" y2="155" stroke="#94a3b8" stroke-width="3" stroke-dasharray="6,4" />
  <polygon points="340,155 325,145 325,165" fill="#94a3b8" />

  <!-- Node 2: Evaluation -->
  <rect x="350" y="110" width="240" height="90" fill="#334155" rx="6" stroke="#475569" stroke-width="1.5" />
  <text x="470" y="135" fill="#38bdf8" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Rule CHG-01: Eval</text>
  <text x="470" y="160" fill="#e2e8f0" font-family="sans-serif" font-size="12" text-anchor="middle">Change Threshold Analysis</text>
  <text x="470" y="180" fill="#4ade80" font-family="sans-serif" font-size="11" text-anchor="middle">Incremental Change (RFC-104)</text>

  <line x1="590" y1="155" x2="640" y2="155" stroke="#94a3b8" stroke-width="3" stroke-dasharray="6,4" />
  <polygon points="650,155 635,145 635,165" fill="#94a3b8" />

  <!-- Node 3: Resolution -->
  <rect x="660" y="110" width="230" height="90" fill="#0f172a" rx="6" stroke="#475569" stroke-width="1.5" />
  <text x="775" y="135" fill="#f8fafc" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Approved Resolution</text>
  <text x="775" y="160" fill="#cbd5e1" font-family="sans-serif" font-size="12" text-anchor="middle">HITL Transition &amp; Upskilling</text>
  <text x="775" y="180" fill="#cbd5e1" font-family="sans-serif" font-size="11" text-anchor="middle">Architecture Update Contract</text>

  <line x1="775" y1="200" x2="775" y2="240" stroke="#94a3b8" stroke-width="3" stroke-dasharray="6,4" />
  <polygon points="775,250 765,235 785,235" fill="#94a3b8" />

  <!-- Node 4: Audit -->
  <rect x="520" y="260" width="370" height="80" fill="#064e3b" rx="6" stroke="#10b981" stroke-width="1.5" />
  <text x="705" y="290" fill="#34d399" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Rule CHG-03: Post-Launch Audit</text>
  <text x="705" y="315" fill="#a7f3d0" font-family="sans-serif" font-size="12" text-anchor="middle">Automated Live APM Value Realization Checks</text>
</svg>
